<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكاديمية أنس التعليمية</title>
<meta name="description" content="أكاديمية أنس التعليمية - منصة شاملة للثانوية العامة والبرمجة">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#f0f2f5}
header{background:#0b1d3a;color:#fff;padding:20px;text-align:center}
.hero{background:linear-gradient(135deg,#0b1d3a,#2a5bd7);color:#fff;padding:40px 20px;text-align:center}
.hero button{margin-top:15px;padding:12px 25px;border:none;border-radius:25px;background:#00e676;font-weight:bold;font-size:16px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px}
.card{background:#fff;padding:20px;border-radius:15px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.1)}
footer{background:#0b1d3a;color:#fff;text-align:center;padding:15px;margin-top:20px}
</style>
</head>
<body>
<header><h1>📚 أكاديمية أنس</h1><p>مساحة للتعلم الواضح</p></header>
<div class="hero"><h2>اتعلم من البيت بسهولة</h2><p>فيديوهات - مذكرات - امتحانات</p><button>ابدأ الآن</button></div>
<div class="cards">
<div class="card"><h3>3 ثانوي</h3><p>مراجعات نهائية</p></div>
<div class="card"><h3>2 ثانوي</h3><p>شرح مبسط</p></div>
<div class="card"><h3>برمجة</h3><p>HTML, Python</p></div>
<div class="card"><h3>قرآن</h3><p>حفظ ومتابعة</p></div>
</div>
<footer>© 2026 أكاديمية أنس</footer>
</body>
</html>
